[plugin]

name="dot-fx"
description="Visual effects as a catalogue of documents: pooled instances, a per-frame budget and a quality tier, distance culling, decals with a cap, a post-processing stack, and camera shake computed as a value the game applies. An effect never changes the simulation, which is why a client may drop one. Depends only on dot-core."
author="dot"
version="0.1.0"
script="dot_fx_plugin.gd"
